name: Deploy to GitHub Pages

on:
  # Deploy on every push to main, and allow manual runs from the Actions tab.
  push:
    branches: [main]
  workflow_dispatch:

# Grant the deploy job the tokens Pages needs (OIDC deployment).
permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time. Don't cancel an in-flight deploy mid-upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `build` runs `tsc && vite build` → typechecks, then bundles to dist/.
      # public/CNAME is copied into dist/ so the custom domain survives deploys.
      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - name: Upload dist as a Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
