<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="c" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc23a"/>
      <stop offset="1" stop-color="#cc8a00"/>
    </linearGradient>
    <filter id="g" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
  </defs>
  <rect width="32" height="32" rx="7" ry="7" fill="#000000"/>
  <!-- gradient-descent curve -->
  <path d="M6.5 7 Q16 31 25.5 7" fill="none" stroke="url(#c)"
        stroke-width="2.6" stroke-linecap="round"/>
  <!-- glow behind the converged point -->
  <circle cx="16" cy="18.4" r="3.4" fill="#ffb000" opacity="0.5" filter="url(#g)"/>
  <!-- the ball resting at the minimum -->
  <circle cx="16" cy="18.4" r="2.9" fill="#ffb000"/>
</svg>
